[package]
name = "parqkit"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A fast Rust CLI and library for inspecting, streaming, converting, and merging Parquet data with Arrow."
license = "MIT"
repository = "https://github.com/sxndmxn/parqkit"
homepage = "https://docs.rs/parqkit"
documentation = "https://docs.rs/parqkit"
keywords = ["parquet", "arrow", "cli", "data-conversion", "data-engineering"]
categories = ["command-line-utilities", "encoding"]
exclude = ["/.github", "/AGENTS.md", "/stress"]

[features]
default = []
stress-tools = ["dep:anyhow", "dep:rand"]

[dependencies]
clap = { version = "4", features = ["derive"] }
parquet = "59"
arrow = { version = "59", features = ["prettyprint"] }
# 7.2 uses language features newer than the crate's Rust 1.85 floor.
comfy-table = "=7.1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = { version = "1", optional = true }
thiserror = "2"
glob = "0.3"
half = "2"
rand = { version = "0.8", optional = true }

[dev-dependencies]
anyhow = "1"

[[bin]]
name = "parqkit"
path = "src/main.rs"

[[bin]]
name = "parqkit-generate"
path = "src/bin/parqkit-generate.rs"
required-features = ["stress-tools"]

[[test]]
name = "stress"
path = "tests/stress.rs"
required-features = ["stress-tools"]

[lints.rust]
unsafe_code = "forbid"
unused_imports = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
cargo = { level = "allow", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
checked_conversions = "deny"
